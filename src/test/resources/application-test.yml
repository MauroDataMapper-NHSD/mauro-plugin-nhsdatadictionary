micronaut:
    server:
        port: -1
        max-request-size: 200mb
        multipart:
            max-file-size: 200mb
        netty:
            idle-timeout: 30m

    http:
        services:
            mauro:
                url: 'http://localhost:2345'
        #       apikey: 1234
        client:
            read-timeout: 10m      # Read timeout
            connect-timeout: 100s
            max-content-length: 20000000
    security:
        enabled: false
datasources:
    default:
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
        url: jdbc:tc:postgresql:16-alpine:///db
