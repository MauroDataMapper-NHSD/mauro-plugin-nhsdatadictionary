datasources:
    default:
        url: jdbc:postgresql://localhost:5432/sandbox
        username: sandbox
        password: sandbox
        dialect: POSTGRES
        db-type: postgres
        driver-class-name: org.postgresql.Driver

javamail:
    authentication:
        username: $$username$$ # Replace me!
        password: $$password$$ # Replace me!
    properties:
        mail:
            smtp:
                port: 587 # Replace me!
                auth: true
                starttls:
                    enable: true
                host: $$host$$ # Replace me!

mauro:
    audit:
        scope: ALL